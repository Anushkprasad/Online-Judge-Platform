version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: oj-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-oj_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - oj-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/${MONGO_DB:-oj_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeychangeinproduction}
      CLIENT_URL: http://localhost:5173
      EVALUATOR_MODE: ${EVALUATOR_MODE:-local}
      EVALUATOR_CPU_LIMIT: ${EVALUATOR_CPU_LIMIT:-0.5}
      EVALUATOR_MEMORY_LIMIT: ${EVALUATOR_MEMORY_LIMIT:-128m}
      SUBMISSION_WORKER_CONCURRENCY: ${SUBMISSION_WORKER_CONCURRENCY:-1}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
    networks:
      - oj-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: oj-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - oj-network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  oj-network:
    driver: bridge
